name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dbal: ['^3.8.2', '^4.0']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer update --with 'doctrine/dbal:${{ matrix.dbal }}' --no-interaction --prefer-dist --no-progress
      - run: php tests/bin/test-autoload.php
      - run: composer test
